<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Exam Management System</title>

    <link rel="stylesheet" href="style.css" />

    <script defer src="schedule.js"></script>
    <script defer src="script.js"></script>
</head>
<body>

    <div class="background-glow"></div>

    <header class="topbar">

        <div class="branding">
            <div class="logo-box">S</div>

            <div>
                <h1>School Examination System</h1>
                <p>Final Exams 2026</p>
            </div>
        </div>

        <div class="clock-section">
            <div id="liveDate">Sunday, May 17</div>
            <div id="liveClock">00:00:00</div>
        </div>

    </header>

    <main class="layout">

        <!-- LEFT -->
        <section class="panel schedule-panel">

            <div class="panel-title">
                Today's Schedule
            </div>

            <div id="scheduleContainer"></div>

        </section>

        <!-- CENTER -->
        <section class="panel main-panel">

            <div class="status-pill" id="statusPill">
                WAITING
            </div>

            <div class="current-exam-title" id="currentExamTitle">
                No Active Exam
            </div>

            <div class="countdown" id="countdown">
                00:00:00
            </div>

            <div class="exam-meta">

                <div class="meta-card">
                    <span>Start</span>
                    <strong id="startTime">--:--</strong>
                </div>

                <div class="meta-card">
                    <span>End</span>
                    <strong id="endTime">--:--</strong>
                </div>

                <div class="meta-card">
                    <span>Remaining</span>
                    <strong id="remainingText">Waiting...</strong>
                </div>

            </div>

            <button id="fullscreenBtn">
                Fullscreen Mode
            </button>

        </section>

        <!-- RIGHT -->
        <section class="panel side-panel">

            <div class="panel-title">
                Active Exams
            </div>

            <div id="activeExams"></div>

            <div class="panel-title upcoming-title">
                Upcoming Exams
            </div>

            <div id="upcomingExams"></div>

        </section>

    </main>

</body>
</html>
