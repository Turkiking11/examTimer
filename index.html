# index.html

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Exam Control System</title>

    <link rel="stylesheet" href="style.css" />

    <script defer src="schedule.js"></script>
    <script defer src="script.js"></script>
</head>
<body>

    <div class="background-grid"></div>
    <div class="background-glow"></div>

    <!-- LOGIN SCREEN -->
    <div class="login-overlay" id="loginOverlay">

        <div class="login-card">

            <div class="login-logo">
                ECS
            </div>

            <h1>Exam Control System</h1>
            <p>Administrator Access</p>

            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />

            <button id="loginBtn">
                Login
            </button>

            <span id="loginError"></span>

        </div>

    </div>

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="branding">

            <div class="logo-box">
                ECS
            </div>

            <div>
                <h1>School Exam System</h1>
                <p>Live Examination Dashboard</p>
            </div>

        </div>

        <div class="clock-box">
            <span id="liveDate"></span>
            <strong id="liveClock"></strong>
        </div>

    </header>

    <!-- MAIN LAYOUT -->
    <main class="layout">

        <!-- LEFT -->
        <section class="panel admin-panel">

            <div class="panel-title">
                Schedule Configuration
            </div>

            <div class="admin-form">

                <input type="text" id="gradeInput" placeholder="Grade (Example: Grade 7)" />

                <input type="text" id="subjectInput" placeholder="Subject" />

                <div class="time-row">
                    <input type="time" id="startInput" />
                    <input type="time" id="endInput" />
                </div>

                <button id="addExamBtn">
                    Add Exam
                </button>

            </div>

            <div class="schedule-list" id="scheduleList"></div>

        </section>

        <!-- CENTER -->
        <section class="panel hero-panel">

            <div class="status-pill" id="statusPill">
                LIVE
            </div>

            <div class="hero-grade" id="heroGrade">
                Grade 7
            </div>

            <div class="hero-subject" id="heroSubject">
                Mathematics Examination
            </div>

            <div class="hero-countdown" id="heroCountdown">
                00:00:00
            </div>

            <div class="hero-details">

                <div class="detail-box">
                    <span>START</span>
                    <strong id="heroStart">08:00</strong>
                </div>

                <div class="detail-box">
                    <span>END</span>
                    <strong id="heroEnd">10:00</strong>
                </div>

                <div class="detail-box">
                    <span>STATUS</span>
                    <strong id="heroStatus">Running</strong>
                </div>

            </div>

            <button id="fullscreenBtn">
                Fullscreen Display
            </button>

        </section>

        <!-- RIGHT -->
        <section class="panel active-panel">

            <div class="panel-title">
                All Active Exams
            </div>

            <div id="activeContainer"></div>

        </section>

    </main>

</body>
</html>
